<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="あといくら家計簿">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2EB263"/>
      <stop offset="1" stop-color="#1B8347"/>
    </linearGradient>
    <linearGradient id="purse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EB76A"/>
      <stop offset="1" stop-color="#1F8E4A"/>
    </linearGradient>
  </defs>
  <!-- iOS rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Coin purse body -->
  <g transform="translate(56 96)">
    <!-- Drawstring top -->
    <path d="M58 96 Q200 -10 342 96"
          fill="none" stroke="#0F4D2A" stroke-width="18" stroke-linecap="round"/>
    <!-- Pinch knots -->
    <circle cx="58" cy="96" r="14" fill="#0F4D2A"/>
    <circle cx="342" cy="96" r="14" fill="#0F4D2A"/>
    <!-- Purse body -->
    <path d="M48 110
             C 48 108, 60 102, 80 100
             C 140 92, 260 92, 320 100
             C 340 102, 352 108, 352 110
             L 360 286
             C 362 318, 332 336, 200 336
             C 68 336, 38 318, 40 286 Z"
          fill="url(#purse)" stroke="#0F4D2A" stroke-width="6"/>
    <!-- Yen mark -->
    <g fill="#FFFFFF">
      <path d="M150 158 L200 220 L250 158 L228 158 L200 196 L172 158 Z"/>
      <rect x="190" y="208" width="20" height="78" rx="4"/>
      <rect x="160" y="232" width="80" height="12" rx="6"/>
      <rect x="160" y="256" width="80" height="12" rx="6"/>
    </g>
    <!-- Sparkle -->
    <g transform="translate(360 22)">
      <path d="M0 -30 L8 -8 L30 0 L8 8 L0 30 L-8 8 L-30 0 L-8 -8 Z" fill="#FFD33A"/>
      <path d="M40 -8 L44 -2 L50 0 L44 2 L40 8 L36 2 L30 0 L36 -2 Z" fill="#FFD33A"/>
    </g>
  </g>
</svg>
